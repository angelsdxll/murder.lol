<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>murdered.lol</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      position: relative;
      overflow: hidden;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 300;
    }
    .overlay button {
      background: none;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    /* friends.gif */
    #titleImg {
      width: 200px;
      height: auto;
      margin-bottom: 20px;
      position: relative;
      z-index: 10; /* bottom layer */
    }

    /* PNG overlay */
    .overlay-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("fakeascii.png") repeat;
      pointer-events: none;
      z-index: 50; /* above friends.gif, below members/text */
    }

    .names {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 20px;
      justify-content: center;
      position: relative;
      z-index: 100; /* above overlay */
    }
    .member {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 100; /* above overlay */
    }
    .member img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 100; /* above overlay */
    }
    .username {
      font-size: 14px;
      color: #fff;
      position: relative;
      z-index: 150; /* keep usernames visible */
    }
    .links {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      position: relative;
      z-index: 150; /* keep links visible */
    }
    .links img {
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .back-arrow {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: none;
      z-index: 200; /* above overlay */
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay">
    <button onclick="startSite()">Enter</button>
  </div>

  <img id="titleImg" src="friends.gif" alt="Friends">

  <div class="overlay-image"></div> <!-- fakeascii overlay -->

  <img id="backArrow" class="back-arrow" src="arrow.png" alt="Back" onclick="goBack()">

  <div class="names" id="names">
    <div class="member" data-name="config">
      <img src="config.png" alt="config">
      <div class="username">config</div>
    </div>
    <div class="member" data-name="value">
      <img src="value.png" alt="value">
      <div class="username">value</div>
    </div>
    <div class="member" data-name="Dorm">
      <img src="Dorm.png" alt="Dorm">
      <div class="username">Dorm</div>
    </div>
    <div class="member" data-name="vanish">
      <img src="vanish.png" alt="vanish">
      <div class="username">vanish</div>
    </div>
    <div class="member" data-name="ready">
      <img src="ready.png" alt="ready">
      <div class="username">ready</div>
    </div>
    <div class="member" data-name="pursuit">
      <img src="pursuit.png" alt="pursuit">
      <div class="username">pursuit</div>
    </div>
  </div>

  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const overlay = document.getElementById('overlay');
    const music = document.getElementById('music');
    const namesContainer = document.getElementById('names');
    const backArrow = document.getElementById('backArrow');

    const links = {
      config: { doxbin: "https://doxbin.net/user/config", telegram: "https://t.me/config" },
      value: { doxbin: "https://doxbin.net/user/value", telegram: "https://t.me/value" },
      Dorm: { doxbin: "https://doxbin.net/user/Dorm", telegram: "https://t.me/Dorm" },
      vanish: { doxbin: "https://doxbin.net/user/vanish", telegram: "https://t.me/vanish" },
      ready: { doxbin: "https://doxbin.net/user/ready", telegram: "https://t.me/ready" },
      pursuit: { doxbin: "https://doxbin.net/user/pursuit", telegram: "https://t.me/pursuit" }
    };

    function startSite() {
      overlay.style.display = 'none';
      music.play();
    }

    document.querySelectorAll('.member').forEach(member => {
      member.addEventListener('click', () => {
        const name = member.dataset.name;

        // Change browser title
        document.title = `holy - ${name}`;

        namesContainer.innerHTML = `
          <div class="member">
            <img src="${name}.png" alt="${name}">
            <div class="username">${name}</div>
            <div class="links">
              <a href="${links[name].doxbin}" target="_blank"><img src="doxbin.png" alt="doxbin"></a>
              <a href="${links[name].telegram}" target="_blank"><img src="telegram.png" alt="telegram"></a>
            </div>
          </div>
        `;
        backArrow.style.display = 'block';
      });
    });

    function goBack() {
      location.reload();
    }
  </script>

</body>
</html>
