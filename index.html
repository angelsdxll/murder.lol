<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>??</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

#enterScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    cursor: pointer;
    font-size: 30px;
    letter-spacing: 3px;
}

.swing-container {
    position: absolute;
    top: -83px;
    left: 50%;
    transform-origin: top center;
    animation: swing 3s ease-in-out infinite;
}

@keyframes swing {
    0% { transform: translateX(-50%) rotate(-8deg); }
    50% { transform: translateX(-50%) rotate(8deg); }
    100% { transform: translateX(-50%) rotate(-8deg); }
}

.swing-container img {
    width: 220px;
    display: block;
}

.names {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

.names span {
    display: block;
    color: white;
    font-size: 22px;
    margin: 10px 0;
    transition: 0.3s;
}

.names span:hover {
    color: #aaa;
}
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    animation: fade 1s linear forwards;
}

@keyframes fade {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0); }
} 
.names p { 
    font-size: 18px;
    margin-top: 20px;
    color: #808080;
}
.names p:hover {
    color: #fffdfd;
    }
    
</style>
</head>
<body>

<div id="enterScreen">click to continue</div>

<div class="swing-container">
    <img src="boy.png" alt="swing">
</div>

<div class="names">
    <span>despair</span>
    <span>value</span>
    <span>config</span>
    <span>tragic</span>
    <p>end of an era</p>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>


<script>
const enterScreen = document.getElementById("enterScreen");
const music = document.getElementById("bgMusic");
music.volume = 0.2; // Set initial volume
enterScreen.addEventListener("click", () => {
    enterScreen.style.display = "none";
    music.play();
});

document.addEventListener("mousemove", function(e) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.left = e.pageX + "px";
    sparkle.style.top = e.pageY + "px";
    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 1000);
});

</script>

</body>
</html>
