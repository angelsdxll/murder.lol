<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <img src="gif.gif" alt="Full screen GIF" />
  </div>
</body>
</html>
