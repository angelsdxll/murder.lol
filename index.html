<style>
html, body {
    margin: 0;
    padding: 0;
    background: darkblue;
    font-family: 'Jackeyfont';
    letter-spacing: 0.01em;
    overflow-x: hidden;
}

.logo-top {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    max-width: 70vw;
    z-index: 100001;
    pointer-events: none;
    animation: none !important;
    opacity: 1 !important;
}

.center {
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    text-align: center;
    z-index: 2;
}

w {
    background: white;
    color: darkblue;
    font-weight: bold;
    padding: 2px 6px;
}

a {
    text-decoration: none;
    color: darkblue;
}

.footer-text {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.08em;
    z-index: 3;
    pointer-events: none;
}

@keyframes flicker {
    0% { opacity: 1; }
    2% { opacity: 0.3; }
    4% { opacity: 1; }
    8% { opacity: 0.1; }
    9% { opacity: 1; }
    12% { opacity: 0.6; }
    100% { opacity: 1; }
}

.flicker-layer {
    animation: flicker 3.8s infinite;
}

.scanlines {
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
    );
    mix-blend-mode: overlay;
}

.snow-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
}

.snowflake {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
}

@keyframes fall {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(100vh); opacity: 0.5; }
}

@keyframes diagonal-fall {
    from { transform: translate(0,0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translate(10vw,100vh); opacity: 0.25; }
}
</style>
</head>
